<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário!</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="decor-side">
            <p class="instruction">Toque para ligar</p>
            <div class="lamp-container" id="lampSwitch">
                <div class="lamp">
                    <div class="pull-string"></div>
                </div>
                <div class="light-glow"></div>
            </div>
        </div>

        <div class="card" id="mainCard">
            <div class="brand">
                <span class="dot"></span> FEZAcademy
                <p class="subtitle">SPECIAL EDITION</p>
            </div>
            
            <h1 id="title">Feliz Aniversário!</h1>
            <p class="message" id="message">Clique no botão abaixo para liberar sua surpresa de aniversário.</p>
            
            <div id="surpriseArea" class="hidden">
                <div class="gift-box">🎁</div>
                <p class="special-text">Você é uma pessoa incrível! Que seu código nunca tenha bugs e sua vida tenha muito brilho! ✨</p>
            </div>

            <button class="btn-primary" id="btnPresente">Abrir Presente 🎁</button>
            
            <div class="footer-links">
                <p>Feito com ❤️ por [Seu Nome]</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
